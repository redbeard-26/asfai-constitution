name: asfai

services:
  education:
    image: ${EDUCATION_IMAGE:?EDUCATION_IMAGE is required}
    restart: unless-stopped
    env_file: [/opt/asfai/education.env]
    environment:
      ASFAI_SITE_ORIGIN: ${TEMPORARY_MCP_ORIGIN:?TEMPORARY_MCP_ORIGIN is required}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/education').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 8

  constitution:
    image: ${CONSTITUTION_IMAGE:?CONSTITUTION_IMAGE is required}
    restart: unless-stopped
    env_file: [/opt/asfai/constitution.env]
    environment:
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://constitution.asfai.org
      EDUCATION_ORIGIN: http://education:3000
    depends_on:
      education: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 8

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      education: { condition: service_healthy }
      constitution: { condition: service_healthy }

volumes:
  caddy_data:
  caddy_config:
