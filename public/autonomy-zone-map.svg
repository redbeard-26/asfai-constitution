.th{font:500 14px "Segoe UI",Arial,sans-serif;fill:#2C2C2A}
.ts{font:400 12px "Segoe UI",Arial,sans-serif;fill:#5F5E5A}
.thv{font:500 14px "Segoe UI",Arial,sans-serif;fill:#444441}
.leader{stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:4 4}
</style>
