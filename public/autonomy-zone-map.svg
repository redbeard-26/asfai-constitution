<svg width="680" viewBox="0 0 680 550" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Animated autonomy zone map, T+0 to T+24h</title>
<desc>An animated battlefield map cycling between two snapshots 24 hours apart. Grid cells are rated by allowed drone autonomy level (green level 1, amber level 2, red level 3); filled cells are active, white cells with colored borders are inactive. Autonomous drones are blue with a border showing their certified level: green-rated drones stay in active green cells, a yellow-rated drone works the amber box, and a red-rated drone operates in an active red cell within the village as the front advances east.</desc>
